services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: parcel_verification
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # --appendonly yes + a volume: without this, Redis is pure in-memory —
    # a container restart mid-retry-cycle would silently drop every queued
    # BullMQ job, which is exactly the "must not lose a submission" failure
    # mode the brief calls out for a partner outage. This closes the same
    # gap for our own infra restarting, not just the partner being down.
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/parcel_verification
      REDIS_URL: redis://redis:6379
      API_KEY: dev-local-api-key
      UPLOAD_DIR: /app/uploads
      REGISTRY_RETRY_BASE_MS: 2000
      REGISTRY_MAX_ATTEMPTS: 5
      REGISTRY_CALL_TIMEOUT_MS: 3000
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      # node:24-slim has no curl/wget — Node's own http module does the
      # same job with nothing extra to install. This is the same /healthz
      # a real container orchestrator's liveness/readiness probe would hit.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/healthz',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
